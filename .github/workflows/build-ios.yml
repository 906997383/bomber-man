name: Build iOS

# 用 GitHub 托管的 macOS runner 编译 Bomber Man 的 iOS 端，无需本地 Mac。
# 产物（始终产出）：
#   - BomberMan-simulator.app.zip   iOS 模拟器 .app（无需签名，可直接拖进模拟器）
#   - BomberMan-unsigned.ipa        未签名真机 IPA（可用 AltStore / Sideloadly 重签安装）
# 可选产物（设置好签名密钥后自动产出）：
#   - BomberMan.ipa                 已签名可直接安装的 IPA
#
# 触发方式：
#   - 手动：Actions → Build iOS → Run workflow（可在弹窗里选择导出方式）
#   - 推送：main 分支上 www/、ios/、build_ios.sh 或本 workflow 文件变更时自动构建

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 签名 IPA 的导出方式（仅在配置了签名密钥时生效）
        required: false
        default: development
        type: choice
        options:
          - development
          - app-store
          - ad-hoc
          - enterprise
  push:
    branches: [main]
    paths:
      - "www/**"
      - "ios/**"
      - "build_ios.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS (${{ github.event.inputs.export_method || 'unsigned' }})
    runs-on: macos-15
    env:
      BUNDLE_ID: com.trae.bomberman
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'development' }}
      # secrets 不能在 if: 里直接引用，先映射到 env，再用 env.X != '' 判断
      SEC_CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      SEC_P12_PASS: ${{ secrets.P12_PASSWORD }}
      SEC_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      SEC_TEAM_ID: ${{ secrets.TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-temp-keychain' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes | head -5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify build script syntax
        run: bash -n build_ios.sh

      # build_ios.sh 内部会完成 npx cap sync ios + pod install + xcodebuild
      - name: Build iOS Simulator .app (no signing)
        run: ./build_ios.sh --simulator --configuration Debug

      - name: Build unsigned IPA (for re-sign / sideload)
        run: ./build_ios.sh --ipa --no-codesign

      - name: Zip simulator app for artifact
        run: |
          cd dist
          zip -qr BomberMan-simulator.app.zip BomberMan-simulator.app

      - name: Upload simulator & unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            dist/BomberMan-simulator.app.zip
            dist/BomberMan-unsigned.ipa
          if-no-files-found: error

      # ---------- 可选：签名 IPA ----------
      # 需要在仓库 Settings → Secrets and variables → Actions 中配置：
      #   BUILD_CERTIFICATE_BASE64    .p12 证书的 base64（base64 -i cert.p12）
      #   P12_PASSWORD                .p12 的密码
      #   PROVISIONING_PROFILE_BASE64 .mobileprovision 的 base64
      #   TEAM_ID                     10 位开发者团队 ID
      - name: Build signed IPA
        if: ${{ env.SEC_CERT_B64 != '' && env.SEC_P12_PASS != '' && env.SEC_PROFILE_B64 != '' && env.SEC_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          BUILD_CERTIFICATE_BASE64="$SEC_CERT_B64"
          P12_PASSWORD="$SEC_P12_PASS"
          PROVISIONING_PROFILE_BASE64="$SEC_PROFILE_B64"
          TEAM_ID="$SEC_TEAM_ID"
          WORKSPACE="ios/App/App.xcworkspace"
          SCHEME="App"
          ARCHIVE="dist/BomberMan.xcarchive"
          EXPORT_DIR="dist/ipa-signed"
          rm -rf "$ARCHIVE" "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          # 1) 还原证书与描述文件
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          # 2) 临时 keychain 导入证书
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain

          # 3) 安装描述文件并读取其名称
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp /tmp/profile.mobileprovision "$PP_DIR/profile.mobileprovision"
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROFILE_NAME="$(plutil -extract Name raw -o - /tmp/profile.plist)"
          echo "provisioning profile name: $PROFILE_NAME"

          # 4) 取匹配 team 的签名身份
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep "(${TEAM_ID})" | grep -oE '"[^"]*"' | head -1 | tr -d '"')"
          [[ -n "$IDENTITY" ]] || { security find-identity -v -p codesigning build.keychain; echo "::error::未找到 team=$TEAM_ID 的签名身份"; exit 1; }
          echo "signing identity: $IDENTITY"

          # 5) 归档（手动签名）
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath dist/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -quiet archive

          # 6) 导出 IPA
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -quiet

          IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' | head -1)"
          [[ -n "$IPA" ]] || { echo "::error::导出失败，未找到 ipa"; exit 1; }
          mv -f "$IPA" dist/BomberMan.ipa
          echo "signed IPA: dist/BomberMan.ipa"

      - name: Upload signed IPA
        if: ${{ env.SEC_CERT_B64 != '' && env.SEC_P12_PASS != '' && env.SEC_PROFILE_B64 != '' && env.SEC_TEAM_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: dist/BomberMan.ipa
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### iOS 构建完成"
            echo "- 模拟器包：BomberMan-simulator.app.zip（无需签名，拖进 iOS 模拟器即可运行）"
            echo "- 未签名 IPA：BomberMan-unsigned.ipa（可用 AltStore / Sideloadly 重签安装）"
            echo "- 签名 IPA：BomberMan.ipa（仅在配置了签名密钥时产出）"
            echo ""
            echo "在本页底部 Artifacts 区域下载产物。"
          } >> "$GITHUB_STEP_SUMMARY"
